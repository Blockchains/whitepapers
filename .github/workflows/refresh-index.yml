name: refresh whitepaper index
on:
  schedule:
    - cron: "23 4 * * 0"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Rebuild index from blockchainlab.com sitemaps + /pdf page (links only)
        run: python3 scripts/build_index.py
      - name: Commit if changed
        run: |
          git config user.name "Blockchains"
          git config user.email "Blockchains@users.noreply.github.com"
          git add index.json index.csv README.md
          git diff --cached --quiet && { echo "no change"; exit 0; }
          git commit -q -m "refresh index $(date -u +%F)"
          git push -q
